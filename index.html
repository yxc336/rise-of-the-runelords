<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>符文领主的崛起 - NPC 动态档案库</title>
    <style>
        :root {
            --pf-深红: #8b0000;
            --pf-古金: #b8860b;
            --pf-纸张: #f4ece1;
            --pf-边框: #3d2b1f;
            --pf-文本: #2c241e;
            --pf-警告红: #ff3333;
        }

        /* === 动画定义 === */
        @keyframes 纸张展开 {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes 呼吸光 {
            0% { box-shadow: 0 0 50px rgba(0,0,0,0.8); }
            50% { box-shadow: 0 0 70px rgba(184, 134, 11, 0.2); }
            100% { box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        }

        @keyframes 弹窗进入 {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 紧急未保存动画 */
        @keyframes 紧急呼吸 {
            0% { transform: scale(1); box-shadow: 0 0 5px var(--pf-警告红); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px var(--pf-警告红), 0 0 10px #fff; }
            100% { transform: scale(1); box-shadow: 0 0 5px var(--pf-警告红); }
        }

        @keyframes 背景暗流 {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes 尘埃漂浮 {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) translateX(20px) rotate(180deg); opacity: 0; }
        }

        body {
            background-color: #111;
            background-image: 
                url('https://www.transparenttextures.com/patterns/dark-leather.png'),
                radial-gradient(circle at 50% 50%, rgba(139, 0, 0, 0.15), rgba(0, 0, 0, 0.8));
            background-attachment: fixed, fixed;
            background-size: auto, 200% 200%;
            animation: 背景暗流 15s ease infinite;
            color: var(--pf-文本);
            font-family: "Source Han Serif SC", "Songti SC", serif;
            margin: 0; padding: 30px 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        #特效层 {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; overflow: hidden;
        }

        .奥术尘埃 {
            position: absolute;
            background: var(--pf-古金);
            border-radius: 50%;
            box-shadow: 0 0 4px var(--pf-古金);
        }

        .档案容器 {
            width: 100%; max-width: 1250px;
            background-color: var(--pf-纸张);
            background-image: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(210,180,140,0.1) 100%);
            border: 10px solid var(--pf-边框);
            border-image: url('https://www.transparenttextures.com/patterns/dark-leather.png') 30 round;
            padding: 30px;
            position: relative;
            animation: 呼吸光 4s infinite ease-in-out, 纸张展开 0.8s ease-out;
            z-index: 1;
        }

        header {
            text-align: center;
            border-bottom: 3px double var(--pf-深红);
            margin-bottom: 25px; padding-bottom: 15px;
            transition: border-color 0.5s;
        }
        header:hover { border-bottom-color: var(--pf-古金); }

        h1 { 
            color: var(--pf-深红); font-size: 2.6em; margin: 0; letter-spacing: 0.2em; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .副标题 { color: var(--pf-古金); font-size: 1.1em; font-weight: bold; margin-top: 5px; letter-spacing: 0.4em; }

        #状态栏 { 
            font-size: 0.85em; color: var(--pf-深红); margin-bottom: 15px; 
            text-align: center; font-style: italic; height: 1.2em;
            transition: opacity 0.3s;
        }

        .控制台 { 
            margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; 
            position: sticky; top: 0; z-index: 100; background: inherit; padding: 10px 0;
            backdrop-filter: blur(2px); align-items: center;
        }

        .按钮 {
            background: var(--pf-深红); color: white; border: 2px solid var(--pf-古金);
            padding: 8px 16px; cursor: pointer; font-weight: bold; 
            display: flex; align-items: center; gap: 5px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .按钮:hover { 
            background: var(--pf-古金); color: var(--pf-深红); 
            transform: translateY(-2px); box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }
        .按钮:active { transform: translateY(0); box-shadow: 0 2px 3px rgba(0,0,0,0.3); }

        .同步按钮 { background: #2e4d2e; border-color: #4CAF50; }
        .同步按钮:hover { background: #4CAF50; color: white; }
        
        /* 未保存警告样式 */
        .按钮-未保存 {
            background: #800000 !important;
            border-color: var(--pf-警告红) !important;
            color: var(--pf-警告红) !important;
            animation: 紧急呼吸 1.5s infinite ease-in-out !important;
        }
        .按钮-未保存:hover { color: #fff !important; }

        /* 模式切换按钮样式 */
        .按钮-模式 { background: #333; border-color: #666; color: #aaa; }
        body.编辑模式 .按钮-模式 { background: var(--pf-深红); border-color: var(--pf-古金); color: white; }

        /* 分隔线 */
        .分隔符 { width: 1px; height: 30px; background: rgba(0,0,0,0.1); margin: 0 5px; border-right: 1px solid rgba(255,255,255,0.3); }

        /* 管理员控件组 - 默认隐藏 */
        .管理员组 { display: none; gap: 10px; align-items: center; }
        body.编辑模式 .管理员组 { display: flex; }

        .表格包装层 { overflow-x: auto; border: 1px solid var(--pf-边框); box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; background-color: rgba(255,255,255,0.2); }
        thead { background-color: var(--pf-深红); color: white; }
        th { padding: 12px; text-align: left; border: 1px solid var(--pf-边框); font-size: 0.9em; }
        td { 
            padding: 10px; border: 1px solid #c4a484; vertical-align: middle; font-size: 0.85em; 
            transition: background-color 0.3s;
        }

        tr:hover td { background-color: rgba(184, 134, 11, 0.1); }
        .行进入 { animation: 纸张展开 0.5s ease-out backwards; }

        .立绘框 { 
            width: 65px; height: 80px; border: 2px solid var(--pf-古金); 
            overflow: hidden; cursor: zoom-in; margin: 0 auto; 
            position: relative; background: #000;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .立绘框:hover { transform: scale(1.05); box-shadow: 0 4px 8px rgba(0,0,0,0.5); border-color: var(--pf-深红); z-index: 10; }
        .立绘框 img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .立绘框:hover img { transform: scale(1.1); }
        
        .姓名格 { font-weight: bold; color: var(--pf-深红); }
        
        /* 仅在编辑模式下显示可编辑样式 */
        body.编辑模式 [contenteditable="true"]:hover { background: rgba(255,255,255,0.5); cursor: text; }
        body.编辑模式 [contenteditable="true"]:focus { 
            background: white; outline: none;
            box-shadow: 0 0 0 2px var(--pf-古金), 0 0 10px rgba(184, 134, 11, 0.3); color: #000;
        }

        /* 管理列显隐 */
        .管理列 { display: none; }
        body.编辑模式 .管理列 { display: table-cell; }

        .管理格 { display: flex; flex-direction: column; gap: 5px; align-items: center; }
        .操作组 { display: flex; gap: 5px; width: 100%; justify-content: center; }

        .排序控件 { display: flex; gap: 3px; }
        .小方钮 { 
            padding: 2px 6px; cursor: pointer; background: var(--pf-深红); 
            color: white; border: 1px solid var(--pf-古金); font-size: 10px; transition: 0.2s;
        }
        .小方钮:hover { background: var(--pf-古金); }

        .弹窗遮罩 {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); transition: opacity 0.3s;
        }

        .上传面板 {
            background: var(--pf-纸张); border: 2px solid var(--pf-古金);
            padding: 30px; width: 400px; text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            animation: 弹窗进入 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .上传面板 h3 { color: var(--pf-深红); margin-top: 0; font-family: inherit; }
        .上传区域 {
            border: 2px dashed var(--pf-古金); padding: 20px; margin: 15px 0;
            color: var(--pf-深红); font-size: 0.9em; background: rgba(255,255,255,0.4);
            transition: background 0.3s;
        }
        .上传区域:hover { background: rgba(255,255,255,0.8); }

        .网址输入 {
            width: 90%; padding: 8px; background: #fff; border: 1px solid var(--pf-边框);
            color: #333; margin-bottom: 10px; font-family: inherit; transition: box-shadow 0.3s;
        }
        .网址输入:focus { box-shadow: 0 0 8px var(--pf-古金); outline: none; }

        #放大预览 { cursor: zoom-out; }
        #放大预览 img { 
            max-width: 85%; max-height: 85%; border: 4px solid var(--pf-古金); 
            box-shadow: 0 0 40px #000; animation: 弹窗进入 0.3s ease-out;
        }

        .瑟希隆符号 { 
            text-align: center; margin-top: 30px; color: var(--pf-古金); 
            font-size: 1.2em; opacity: 0.4; letter-spacing: 10px; transition: opacity 0.5s;
        }
        .瑟希隆符号:hover { opacity: 1; text-shadow: 0 0 10px var(--pf-古金); }

        /* 专有名词记录框样式 */
        #名词输入框 {
            width: 100%;
            height: 350px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid var(--pf-边框);
            /* 固定文字颜色和大小 */
            color: var(--pf-深红); 
            font-size: 16px; 
            font-family: inherit;
            padding: 15px;
            resize: vertical;
            line-height: 1.6;
            transition: background 0.3s;
        }
        #名词输入框:focus {
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            box-shadow: 0 0 8px var(--pf-古金);
        }
    </style>
</head>
<body>

    <div id="特效层"></div>

    <div class="档案容器">
        <header>
            <h1>符文领主的崛起</h1>
            <div class="副标题">瓦瑞西亚重要人物志</div>
        </header>

        <div id="状态栏">愿阿巴达尔指引你。</div>

        <div class="控制台">
            <button class="按钮 按钮-模式" onclick="切换模式()" id="模式按钮">✎ 编辑模式</button>
            <button class="按钮" onclick="加载数据()">🔄 刷新重载</button>
            <button class="按钮" style="background:#4a3728" onclick="导出备份()">导出</button>

            <div class="管理员组">
                <div class="分隔符"></div>
                <button class="按钮" style="background:#2b3a42" onclick="打开名词弹窗()">📖 专有名词</button>
                <button class="按钮" onclick="添加行()">+ 新增 NPC</button>
                <button class="按钮 同步按钮" id="保存按钮" onclick="保存到云端()">● 祭仪保存 (同步)</button>
                <button class="按钮" style="background:#4a3728" onclick="触发导入()">导入</button>
            </div>
            
            <input type="file" id="导入框" style="display:none" accept=".json" onchange="导入备份(event)">
        </div>

        <div class="表格包装层">
            <table>
                <thead>
                    <tr>
                        <th width="80">立绘</th>
                        <th width="150">姓名</th>
                        <th width="160">身份/职位</th>
                        <th width="200">目标/动机</th>
                        <th>备注与记录</th>
                        <th width="120" class="管理列">档案管理</th>
                    </tr>
                </thead>
                <tbody id="表格主体"></tbody>
            </table>
        </div>
        <div id="页尾锚点"></div>
        <div class="瑟希隆符号">★ ★ ★ ★ ★ ★ ★</div>
    </div>

    <div id="放大预览" class="弹窗遮罩" onclick="this.style.display='none'">
        <img id="预览图" src="">
    </div>

    <div id="更图弹窗" class="弹窗遮罩">
        <div class="上传面板">
            <h3>镜像幻影更替</h3>
            <p style="font-size: 0.8em; color: #5d4037;">直接在这里 Ctrl+V 粘贴图片<br>或使用下方选项</p>
            <div class="上传区域">
                <button class="按钮" style="font-size: 0.8em; margin: 0 auto;" onclick="document.getElementById('隐藏上传').click()">选择本地文件</button>
            </div>
            <input type="text" id="网址输入框" class="网址输入" placeholder="或在此输入图片链接...">
            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                <button class="按钮" onclick="确定网址()">确定链接</button>
                <button class="按钮" style="border-color:#555; background:#666;" onclick="关闭更图弹窗()">关闭</button>
            </div>
        </div>
    </div>

    <div id="名词弹窗" class="弹窗遮罩">
        <div class="上传面板" style="width: 650px; max-width: 90vw;">
            <h3>专有名词与备忘录</h3>
            <textarea id="名词输入框" placeholder="在此记录专有名词、设定备忘录..." oninput="记录名词变更()"></textarea>
            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                <button class="按钮" onclick="关闭名词弹窗()">完成并关闭</button>
            </div>
        </div>
    </div>

    <input type="file" id="隐藏上传" style="display:none" accept="image/*">

    <script>
        const BIN_ID = '694684fbd0ea881f40360d96';
        const API_KEY = '$2a$10$HCO6T/SodpbU9GwiCzOV2uvw75u5tfxjQ5vdK3rvhmJiWdFsUxqTu';
        const IMG_BB_KEY = '192ec7a9ecdec9b51ffed683da3842dc';
        const 密码 = '781674';

        let 内存数据 = [];
        let 专有名词数据 = ""; 
        let 当前编辑索引 = -1;
        let 是否编辑模式 = false; 
        let 有未保存变更 = false;

        window.onload = function() {
            加载数据();
            初始化奥术尘埃();
        };

        // --- 核心状态控制 ---

        function 切换模式() {
            if (!是否编辑模式) {
                const p = prompt("请输入瑟希隆密语以解除封印:");
                if (p === 密码) {
                    是否编辑模式 = true;
                    document.body.classList.add('编辑模式');
                    document.getElementById('模式按钮').innerHTML = "👁 观察模式";
                    更新状态("权限已解锁。");
                    渲染表格();
                } else {
                    alert("秘语错误！");
                }
            } else {
                if (有未保存变更) {
                    if(!confirm("有未保存的变更，退出将导致数据丢失（除非手动同步），确定退出吗？")) return;
                }
                是否编辑模式 = false;
                document.body.classList.remove('编辑模式');
                document.getElementById('模式按钮').innerHTML = "✎ 编辑模式";
                更新状态("回归观察者视角。");
                渲染表格();
            }
        }

        function 设置未保存状态(状态) {
            有未保存变更 = 状态;
            const btn = document.getElementById('保存按钮');
            if (状态) {
                btn.classList.add('按钮-未保存');
                btn.innerHTML = "⚠ 变更未保存";
                document.title = "* 未保存 - 符文领主的崛起";
                saveLocal(); 
            } else {
                btn.classList.remove('按钮-未保存');
                btn.innerHTML = "● 祭仪保存 (同步)";
                document.title = "符文领主的崛起 - NPC 动态档案库";
            }
        }

        window.onbeforeunload = function(e) {
            if (有未保存变更) {
                e.preventDefault();
                e.returnValue = '';
                return '侦测到未保存的魔法波动，确定要离开吗？';
            }
        };

        // --- 数据逻辑 ---

        async function 加载数据() {
            更新状态("正在翻阅金库账本...");
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Bin-Meta': false }
                });
                const data = await res.json();
                let payload = data.record || data;
                
                // 兼容旧的纯数组数据结构
                if (Array.isArray(payload)) {
                    内存数据 = payload;
                    专有名词数据 = "";
                } else {
                    内存数据 = payload.npcs || [];
                    专有名词数据 = payload.terms || "";
                }
                
                document.getElementById('名词输入框').value = 专有名词数据;
                渲染表格();
                设置未保存状态(false);
                更新状态("档案已载入。愿阿巴达尔指引你。");
            } catch (e) {
                更新状态("同步失败，请检查网络。");
            }
        }

        function 渲染表格() {
            const tbody = document.getElementById("表格主体");
            tbody.innerHTML = '';
            
            const editableAttr = 是否编辑模式 ? 'contenteditable="true"' : '';

            内存数据.forEach((npc, index) => {
                const tr = document.createElement('tr');
                tr.className = '行进入';
                tr.style.animationDelay = `${index * 0.05}s`;
                
                let html = `
                    <td>
                        <div class="立绘框" onclick="预览图片('${npc.立绘}')">
                            <img src="${npc.立绘}" class="人物图">
                        </div>
                    </td>
                    <td ${editableAttr} onblur="同步内存(${index}, '姓名', this.innerText)" class="姓名格">${npc.姓名}</td>
                    <td ${editableAttr} onblur="同步内存(${index}, '职位', this.innerText)">${npc.职位}</td>
                    <td ${editableAttr} onblur="同步内存(${index}, '动机', this.innerText)">${npc.动机}</td>
                    <td ${editableAttr} onblur="同步内存(${index}, '备注', this.innerText)">${npc.备注}</td>
                `;

                html += `
                    <td class="管理列">
                        <div class="管理格">
                            <div class="排序控件">
                                <button class="小方钮" onclick="移动位次(${index}, -1)">▲</button>
                                <button class="小方钮" onclick="移动位次(${index}, 1)">▼</button>
                            </div>
                            <div class="操作组">
                                <button class="按钮" style="padding:2px 6px; font-size:11px; flex:1;" onclick="打开更图弹窗(${index})">更图</button>
                                <button class="按钮" style="padding:2px 6px; font-size:11px; background:#444; flex:1;" onclick="删除NPC(${index})">抹除</button>
                            </div>
                        </div>
                    </td>
                `;

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function 同步内存(idx, key, val) {
            const cleanVal = val.trim();
            if (内存数据[idx][key] !== cleanVal) {
                内存数据[idx][key] = cleanVal;
                设置未保存状态(true);
            }
        }

        function 添加行() {
            内存数据.push({ 
                立绘: 'https://i.ibb.co/mFr8QwJm/image.png', 
                姓名: '新NPC', 职位: '新职位', 动机: '动机', 备注: '记录...' 
            });
            渲染表格();
            设置未保存状态(true);
            setTimeout(() => document.getElementById('页尾锚点').scrollIntoView({ behavior: 'smooth' }), 100);
        }

        function 删除NPC(idx) {
            if (confirm(`确定要抹除「${内存数据[idx].姓名}」的记录吗？`)) {
                内存数据.splice(idx, 1);
                渲染表格();
                设置未保存状态(true);
            }
        }

        function 移动位次(index, step) {
            const newIndex = index + step;
            if (newIndex >= 0 && newIndex < 内存数据.length) {
                const temp = 内存数据[index];
                内存数据[index] = 内存数据[newIndex];
                内存数据[newIndex] = temp;
                渲染表格();
                设置未保存状态(true);
            }
        }

        async function 保存到云端() {
            const p = prompt("确认要将更改刻入圣物吗？(输入密语):");
            if (p !== 密码) { alert("密语错误。"); return; }

            更新状态("正在封存卷轴...");
            try {
                // 打包保存 npcs 和 terms
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify({ npcs: 内存数据, terms: 专有名词数据 })
                });
                设置未保存状态(false);
                更新状态("保存成功！档案已安全进入金库。");
            } catch (e) {
                更新状态("保存失败。");
                alert("云端同步失败，请检查网络。");
            }
        }

        // --- 专有名词管理 ---
        function 打开名词弹窗() {
            document.getElementById('名词弹窗').style.display = 'flex';
        }

        function 关闭名词弹窗() {
            document.getElementById('名词弹窗').style.display = 'none';
        }

        function 记录名词变更() {
            const newVal = document.getElementById('名词输入框').value;
            if (专有名词数据 !== newVal) {
                专有名词数据 = newVal;
                设置未保存状态(true); // 触发未保存红灯警告
            }
        }

        // --- 图片处理 ---

        function 打开更图弹窗(index) {
            当前编辑索引 = index;
            document.getElementById('更图弹窗').style.display = 'flex';
            document.getElementById('网址输入框').value = '';
        }

        function 关闭更图弹窗() {
            document.getElementById('更图弹窗').style.display = 'none';
        }

        function 压缩图片(file, quality = 0.75) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxDim = 1920; 
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height && width > maxDim) {
                            height *= maxDim / width;
                            width = maxDim;
                        } else if (height > maxDim) {
                            width *= maxDim / height;
                            height = maxDim;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.clearRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            if (blob) {
                                resolve(blob);
                            } else {
                                resolve(file);
                            }
                        }, 'image/webp', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function 执行上传(file) {
            if (!file) return;
            
            const 状态栏 = document.getElementById("状态栏");
            const 原状态 = 状态栏.innerText;
            更新状态("正在施展压缩咒文并上传..."); 
            关闭更图弹窗();

            try {
                let uploadFile = file;
                if (file.type.match(/image.*/)) {
                    uploadFile = await 压缩图片(file, 0.75);
                }

                const formData = new FormData();
                formData.append("image", uploadFile);

                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_BB_KEY}`, {
                    method: "POST", body: formData
                });
                const result = await res.json();
                
                if (result.success) {
                    内存数据[当前编辑索引].立绘 = result.data.url;
                    渲染表格();
                    设置未保存状态(true);
                    更新状态("立绘更替成功。");
                } else {
                    throw new Error(result.error?.message || "API返回错误");
                }
            } catch (err) { 
                console.error(err);
                alert("传输失败，请检查网络或API限制。"); 
                更新状态(原状态); 
            }
        }

        function 确定网址() {
            const url = document.getElementById('网址输入框').value.trim();
            if (url) {
                内存数据[当前编辑索引].立绘 = url;
                渲染表格();
                设置未保存状态(true);
                关闭更图弹窗();
                更新状态("已链接外部幻影图。");
            }
        }

        document.getElementById('隐藏上传').onchange = (e) => {
            执行上传(e.target.files[0]);
        };

        // --- 杂项与特效 ---

        function 初始化奥术尘埃() {
            const 容器 = document.getElementById('特效层');
            for (let i = 0; i < 40; i++) {
                创建粒子(容器);
            }
        }

        function 创建粒子(容器) {
            const 粒子 = document.createElement('div');
            粒子.classList.add('奥术尘埃');
            const size = Math.random() * 3 + 1;
            粒子.style.width = `${size}px`; 粒子.style.height = `${size}px`;
            粒子.style.left = `${Math.random() * 100}%`;
            const duration = Math.random() * 15 + 10;
            const delay = Math.random() * 10;
            粒子.style.animation = `尘埃漂浮 ${duration}s linear ${delay}s infinite`;
            容器.appendChild(粒子);
        }

        document.addEventListener('paste', function(e) {
            if (document.getElementById('更图弹窗').style.display === 'flex') {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let item of items) {
                    if (item.type.indexOf("image") !== -1) {
                        执行上传(item.getAsFile());
                    }
                }
            }
            if (e.target.getAttribute('contenteditable')) {
                e.preventDefault();
                const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                document.execCommand('insertText', false, text);
            }
        });

        function saveLocal() {
            const localData = { npcs: 内存数据, terms: 专有名词数据 };
            localStorage.setItem('pf_rotr_local', JSON.stringify(localData));
        }

        function 导出备份() {
            const exportData = { npcs: 内存数据, terms: 专有名词数据 };
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `NPC备份_${new Date().toLocaleDateString()}.json`;
            a.click();
        }

        function 触发导入() { document.getElementById("导入框").click(); }

        function 导入备份(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                let payload = JSON.parse(ev.target.result);
                if (Array.isArray(payload)) {
                    内存数据 = payload;
                    专有名词数据 = "";
                } else {
                    内存数据 = payload.npcs || [];
                    专有名词数据 = payload.terms || "";
                }
                document.getElementById('名词输入框').value = 专有名词数据;
                渲染表格();
                设置未保存状态(true);
                更新状态("备份已载入，点击同步生效。");
            };
            reader.readAsText(file);
        }

        function 预览图片(s) {
            document.getElementById("预览图").src = s;
            document.getElementById("放大预览").style.display = 'flex';
        }

        function 更新状态(s) { 
            const el = document.getElementById("状态栏");
            el.style.opacity = 0;
            setTimeout(() => { el.innerText = s; el.style.opacity = 1; }, 200);
        }
    </script>
</body>
